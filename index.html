    // ==========================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.rainNode = null;
        this.rainGain = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playZenChime(freq = 528) {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.2, this.ctx.currentTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 2.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 2.5);
        } catch (e) {
          console.warn('Audio error:', e);
        }
      }
      toggleRain(on) {
        try {
          this.init();
          if (!this.ctx) return;
          if (!on) {
            if (this.rainNode) {
              this.rainGain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.5);
              setTimeout(() => {
                try { this.rainNode.stop(); } catch(e){}
                this.rainNode = null;
              }, 500);
            }
            return;
          }
          if (this.rainNode) return;
          const bufferSize = this.ctx.sampleRate * 2;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            data[i] = (b0 + b1 + b2) * 0.1;
          }
          this.rainNode = this.ctx.createBufferSource();
          this.rainNode.buffer = buffer;
          this.rainNode.loop = true;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(800, this.ctx.currentTime);
          this.rainGain = this.ctx.createGain();
          this.rainGain.gain.setValueAtTime(0.01, this.ctx.currentTime);
          this.rainGain.gain.linearRampToValueAtTime(0.12, this.ctx.currentTime + 1);
          this.rainNode.connect(filter);
          filter.connect(this.rainGain);
          this.rainGain.connect(this.ctx.destination);
          this.rainNode.start();
        } catch(e) {
          console.warn('Rain audio error:', e);
        }
      }
    }

    // ==========================================
    function analyzeVietnameseEmotionNLP(title, text) {
      const full = (title + ' ' + text).toLowerCase();
      
      const joyWords = ['vui', 'hạnh phúc', 'tuyệt vời', 'yêu', 'cười', 'thích', 'tự hào', 'hài lòng', 'may mắn', 'tươi tắn', 'thoải mái', 'kem', 'bạn thân', 'khen'];
      const optimismWords = ['bình yên', 'nhẹ nhõm', 'tin tưởng', 'hy vọng', 'cố gắng', 'ấm áp', 'an tâm', 'yên bình', 'biết ơn', 'tích cực', 'thư thái', 'ổn rồi'];
      const anxietyWords = ['lo', 'sợ', 'áp lực', 'căng thẳng', 'hoảng', 'cuống', 'tim đập', 'mất ngủ', 'bài thi', 'điểm kém', 'bố mẹ', 'kỳ thi', 'bất an', 'rối'];
      const sadnessWords = ['buồn', 'khóc', 'cô đơn', 'thất vọng', 'tủi thân', 'chán', 'tổn thương', 'mệt mỏi', 'bỏ rơi', 'bất công', 'buốt', 'nước mắt'];
      const angerWords = ['giận', 'tức', 'bực', 'ức', 'bêu riếu', 'ghét', 'xúc phạm', 'bất công', 'đánh nhau', 'nói xấu', 'bạo lực', 'phẫn nộ', 'cay cú'];

      const countMatches = (list) => list.reduce((acc, word) => acc + (full.includes(word) ? 1 : 0), 0);
      
      let jC = countMatches(joyWords);
      let oC = countMatches(optimismWords);
      let aC = countMatches(anxietyWords);
      let sC = countMatches(sadnessWords);
      let agC = countMatches(angerWords);

      let total = jC + oC + aC + sC + agC;
      if (total === 0) {
        return {
          scores: { joy: 40, optimism: 50, anxiety: 20, sadness: 15, anger: 10 },
          dominant: "Cân bằng & Tĩnh lặng",
          sentiment: 20,
          triggers: ["Nhịp sống thường ngày"],
          message: "Tâm An cảm nhận sự bình lặng trong những dòng chia sẻ của bạn. Một ngày êm đềm cũng là món quà tuyệt vời."
        };
      }

      const joy = Math.min(95, Math.max(5, Math.round((jC / total) * 100)));
      const optimism = Math.min(95, Math.max(5, Math.round((oC / total) * 100)));
      const anxiety = Math.min(95, Math.max(5, Math.round((aC / total) * 100)));
      const sadness = Math.min(95, Math.max(5, Math.round((sC / total) * 100)));
      const anger = Math.min(95, Math.max(5, Math.round((agC / total) * 100)));

      const emotionsMap = [
        { name: "Vui vẻ & Hào hứng", score: joy },
        { name: "Bình yên & Lạc quan", score: optimism },
        { name: "Lo âu & Căng thẳng", score: anxiety },
        { name: "Buồn bã & Trầm lắng", score: sadness },
        { name: "Tức giận & Bức xúc", score: anger }
      ];
      emotionsMap.sort((a, b) => b.score - a.score);
      const dominant = emotionsMap[0].name;

      const triggers = [];
      if (full.includes('toán') || full.includes('thi') || full.includes('học') || full.includes('điểm')) triggers.push('Áp lực học tập / Thi cử');
      if (full.includes('bố') || full.includes('mẹ') || full.includes('gia đình')) triggers.push('Kỳ vọng gia đình');
      if (full.includes('mạng') || full.includes('facebook') || full.includes('story') || full.includes('nhóm')) triggers.push('Không gian mạng / Mạng xã hội');
      if (full.includes('bạn') || full.includes('nói xấu') || full.includes('cô lập')) triggers.push('Mối quan hệ bạn bè');
      if (triggers.length === 0) triggers.push('Tâm trạng trong ngày');

      let message = "Tâm An luôn ở đây đồng hành cùng bạn.";
      if (anxiety > 50) message = "Bạn đang trải qua nhiều âu lo. Hãy hít một hơi thật sâu, từng nút thắt sẽ được gỡ bỏ bạn nhé.";
      else if (sadness > 50) message = "Gửi đến bạn một cái ôm thật chặt. Đừng ngần ngại để bản thân được nghỉ ngơi.";
      else if (anger > 50) message = "Cơn giận là phản ứng tự nhiên. Hãy cho bản thân vài phút im lặng để ngọn lửa trong lòng dịu lại.";
      else if (joy > 50 || optimism > 50) message = "Nguồn năng lượng tích cực này thật đáng trân trọng! Hãy tiếp tục lan tỏa niềm vui nhé.";

      return {
        scores: { joy, optimism, anxiety, sadness, anger },
        dominant,
        sentiment: Math.round((joy + optimism - sadness - anxiety) / 2),
        triggers,
        message
      };
    }

    function checkCrisisKeywords(text) {
      const danger = ['tự tử', 'muốn chết', 'tự hại', 'cắt tay', 'chết đi', 'kết thúc cuộc sống', 'bế tắc quá', 'uống thuốc ngủ', 'nhảy lầu'];
      const lower = text.toLowerCase();
      return danger.some(k => lower.includes(k));
    }

                  <p><strong>1. Hít vào:</strong> Bằng mũi trong 4 giây chậm rãi.</p>
                  <p><strong>2. Giữ hơi:</strong> Nín thở nhẹ nhàng trong 7 giây.</p>
                  <p><strong>3. Thở ra:</strong> Bằng miệng đẩy hết thán khí trong 8 giây.</p>
                </div>

                <button
                  onClick={() => {
                    sound.playZenChime(528);
                    setShowBreathing(false);
                  }}
                  className="w-full py-3 rounded-2xl bg-teal-600 text-white font-bold text-xs sm:text-sm hover:bg-teal-700 cursor-pointer"
                >
                  Tôi Đã Thấy Dịu Đi Rất Nhiều 🌸
                </button>
              </div>
            </div>
          )}

          {/* MODAL SOS KHẨN CẤP */}
          {showEmergency && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-xl space-y-5">
                <div className="flex items-center justify-between pb-3 border-b border-gray-100">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">🚨</span>
                    <h3 className="font-bold text-gray-900 text-base">Đường Dây Nóng Hỗ Trợ Khẩn Cấp</h3>
                  </div>
                  <button onClick={() => setShowEmergency(false)} className="text-gray-400 hover:text-gray-600 font-bold cursor-pointer text-lg">✕</button>
                </div>

                <p className="text-xs text-gray-600">
                  Các tổng đài chính thống tại Việt Nam luôn bảo mật danh tính và hỗ trợ miễn phí 24/7:
                </p>

                <div className="space-y-3">
                  {HOTLINES.map((h) => (
                    <div key={h.number} className={`p-4 rounded-2xl border ${h.color} flex items-center justify-between`}>
                      <div>
                        <h4 className="font-bold text-xs sm:text-sm text-gray-900">{h.name}</h4>
                        <p className="text-[11px] text-gray-600 mt-0.5">{h.desc}</p>
                      </div>
                      <a
                        href={`tel:${h.phone}`}
                        className="px-4 py-2 rounded-xl bg-gray-900 text-white font-bold text-xs whitespace-nowrap hover:bg-gray-800"
                      >
                        Gọi {h.number}
                      </a>
                    </div>
                  ))}
                </div>

                <button
                  onClick={() => setShowEmergency(false)}
                  className="w-full py-2.5 rounded-2xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs cursor-pointer"
                >
                  Đóng cửa sổ
                </button>
              </div>
            </div>
          )}

          {/* MODAL CHI TIẾT NHẬT KÝ */}
          {selectedEntryDetail && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-xl space-y-5 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-3 border-b border-gray-100">
                  <div className="flex items-center gap-3">
                    <span className="text-3xl">{selectedEntryDetail.moodEmoji}</span>
                    <div>
                      <h3 className="font-bold text-gray-900 text-base">{selectedEntryDetail.title}</h3>
                      <p className="text-[11px] text-gray-400">{selectedEntryDetail.date} lúc {selectedEntryDetail.time}</p>
                    </div>
                  </div>
                  <button onClick={() => setSelectedEntryDetail(null)} className="text-gray-400 hover:text-gray-600 font-bold text-lg cursor-pointer">✕</button>
                </div>

                <div className="p-4 rounded-2xl bg-gray-50 text-xs sm:text-sm text-gray-800 leading-relaxed whitespace-pre-wrap">
                  {selectedEntryDetail.content}
                </div>

                <div className="p-4 rounded-2xl bg-teal-50/70 border border-teal-100 space-y-3">
                  <h4 className="text-xs font-bold text-teal-900 uppercase">Phân Tích Cảm Xúc NLP AI</h4>
                  <div className="grid grid-cols-5 gap-2 text-center text-xs">
                    <div className="p-2 rounded-xl bg-white border border-teal-100">
                      <span className="block text-[10px] text-gray-500">Vui vẻ</span>
                      <strong className="text-emerald-700">{selectedEntryDetail.emotions.joy}%</strong>
                    </div>
                    <div className="p-2 rounded-xl bg-white border border-teal-100">
                      <span className="block text-[10px] text-gray-500">Lạc quan</span>
                      <strong className="text-teal-700">{selectedEntryDetail.emotions.optimism}%</strong>
                    </div>
                    <div className="p-2 rounded-xl bg-white border border-teal-100">
                      <span className="block text-[10px] text-gray-500">Lo âu</span>
                      <strong className="text-purple-700">{selectedEntryDetail.emotions.anxiety}%</strong>
                    </div>
                    <div className="p-2 rounded-xl bg-white border border-teal-100">
                      <span className="block text-[10px] text-gray-500">Buồn</span>
                      <strong className="text-blue-700">{selectedEntryDetail.emotions.sadness}%</strong>
                    </div>
                    <div className="p-2 rounded-xl bg-white border border-teal-100">
                      <span className="block text-[10px] text-gray-500">Tức giận</span>
                      <strong className="text-rose-700">{selectedEntryDetail.emotions.anger}%</strong>
                    </div>
                  </div>
                  <p className="text-xs text-teal-800 italic mt-2">
                    "{selectedEntryDetail.empathyMessage}"
                  </p>
                </div>

                <div className="flex justify-between items-center pt-2">
                  <button
                    onClick={() => {
                      setEntries(prev => prev.filter(e => e.id !== selectedEntryDetail.id));
                      setSelectedEntryDetail(null);
                    }}
                    className="text-xs font-bold text-rose-600 hover:text-rose-800 cursor-pointer"
                  >
                    🗑️ Xóa trang này
                  </button>
                  <button
                    onClick={() => setSelectedEntryDetail(null)}
                    className="px-5 py-2.5 rounded-xl bg-teal-600 text-white font-bold text-xs hover:bg-teal-700 cursor-pointer"
                  >
                    Đóng
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* NÚT BẠN ĐỒNG HÀNH AN AN NỔI 24/7 */}
          <div className="fixed bottom-6 right-6 z-40">
            <button
              onClick={() => setActiveTab('chat')}
              className="px-4 py-3 rounded-full bg-gradient-to-r from-teal-600 to-emerald-600 text-white font-bold text-xs sm:text-sm shadow-lg shadow-teal-700/30 hover:scale-105 active:scale-95 transition-all flex items-center gap-2 cursor-pointer"
            >
              <span className="text-lg">🌸</span>
              <span>Tâm sự cùng An An</span>
            </button>
          </div>

          {/* FOOTER */}
          <footer className="mt-16 bg-white border-t border-teal-100 py-8 text-xs text-gray-500">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="font-extrabold text-gray-900 text-sm">TÂM AN</span>
                <span>• Không gian an toàn hỗ trợ tâm lý & an toàn không gian mạng</span>
              </div>
              <div className="flex items-center gap-4">
                <button onClick={() => setShowEmergency(true)} className="hover:text-rose-600 font-bold cursor-pointer">Tổng đài 111</button>
                <button onClick={() => setShowBreathing(true)} className="hover:text-teal-600 font-bold cursor-pointer">Bài tập thở</button>
                <span>Quyền riêng tư tuyệt đối</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Khởi tạo React Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
